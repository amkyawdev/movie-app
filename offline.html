<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Burme Movies</title>
  <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0a0a0a; color: #fff; font-family: 'DM Sans', sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 24px; text-align: center; }
    .icon { font-size: 4rem; color: #FFB800; display: block; margin-bottom: 16px; }
    h1 { font-size: 1.8rem; margin-bottom: 8px; }
    p { color: #6B7280; font-size: 0.875rem; margin-bottom: 24px; }
    button { background: #FFB800; color: #0a0a0a; border: none; padding: 12px 24px;
             border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div>
    <i class="bi bi-wifi-off icon"></i>
    <h1>You're offline</h1>
    <p>Check your internet connection and try again</p>
    <button onclick="window.location.reload()">
      <i class="bi bi-arrow-clockwise"></i> Retry
    </button>
  </div>
</body>
</html>
