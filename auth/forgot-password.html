<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>Reset Password — Burme Movies</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="../server/firebaseConfig.js"></script>
</head>
<body>
<div class="auth-page">
  <div class="auth-card slide-in-right">
    <div style="text-align:center;margin-bottom:24px">
      <div style="width:56px;height:56px;border-radius:50%;background:rgba(255,184,0,0.12);border:2px solid var(--accent-gold);display:flex;align-items:center;justify-content:center;margin:0 auto 12px">
        <i class="bi bi-key-fill" style="font-size:1.5rem;color:#FFB800"></i>
      </div>
      <h2 style="font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:0.08em">Reset Password</h2>
      <p style="font-size:0.85rem;color:#6B7280;margin-top:4px">Enter your email and we'll send a reset link</p>
    </div>

    <div class="form-error" id="resetError"></div>
    <div id="resetSuccess" style="display:none;background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:#22c55e;padding:10px 14px;border-radius:8px;font-size:0.82rem;margin-bottom:16px">
      <i class="bi bi-check-circle-fill"></i> Reset email sent! Check your inbox.
    </div>

    <form id="resetForm" onsubmit="handleReset(event)">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="form-input-wrapper">
          <input type="email" id="resetEmail" class="form-input" 
            placeholder="you@example.com" required autocomplete="email">
          <i class="bi bi-envelope form-input-icon" style="pointer-events:none"></i>
        </div>
      </div>
      <button type="submit" class="btn btn-primary" id="resetBtn" 
        style="width:100%;justify-content:center">
        <i class="bi bi-send-fill"></i> Send Reset Link
      </button>
    </form>

    <div class="auth-footer" style="margin-top:16px">
      <a href="login.html"><i class="bi bi-arrow-left"></i> Back to Sign In</a>
    </div>
  </div>
</div>

<script src="../js/auth.js"></script>
<script>
  async function handleReset(e) {
    e.preventDefault();
    hideError('resetError');
    const email = document.getElementById('resetEmail').value.trim();
    setLoading('resetBtn', true);
    const result = await sendPasswordReset(email);
    setLoading('resetBtn', false);
    if (result.error) showError('resetError', result.error);
    else {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('resetSuccess').style.display = 'block';
    }
  }
</script>
</body>
</html>
